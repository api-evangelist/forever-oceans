aid: forever-oceans
name: Forever Oceans
description: 'Forever Oceans Corporation was a US offshore aquaculture company, founded
  in 2014 and headquartered in Virginia, that raised sushi-grade kanpachi (Seriola
  rivoliana) in deep water off the Pacific coast of Panama using a patented single-point
  mooring system that let its submerged pens orient with ocean currents. It raised
  roughly $170M and held a large Brazilian marine-aquaculture concession, with planned
  farms in Brazil and Indonesia. Its investors brought in restructuring and liquidation
  specialists in November 2024, and its corporate domain foreveroceans.com is now a
  registrar parking page that refuses HTTPS. Seafood production, not software, was
  the product: the company never published an API, developer portal, SDK or any
  machine-readable contract, and no such surface survives.'
